---
- name: "APT: Install dependencies"
  ansible.builtin.apt:
    pkg:
      - "tinyproxy"
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: "DNF: Install dependencies"
  ansible.builtin.dnf:
    name:
      - "tinyproxy"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: "Set some system-specific facts"
  ansible.builtin.set_fact:
    tinyproxy_data_dir: "/usr/share/tinyproxy/"

- name: "Write tinyproxy configuration"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/tinyproxy/{{ item }}"
    owner: "root"
    group: "root"
    mode: "644"
  with_items:
    - "tinyproxy.conf"
    - "filter"
  notify: restart_tinyproxy

- name: "UFW: enable port"
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  with_items:
    - "{{ tinyproxy_port }}"
  when: ansible_facts['os_family'] == 'Debian'

- name: "FirewallD: enable port"
  ansible.posix.firewalld:
    immediate: true
    permanent: true
    port: "{{ item }}/tcp"
    state: enabled
  with_items:
    - "{{ tinyproxy_port }}"
  when: ansible_facts['os_family'] == 'RedHat'

- name: "Ensure tinyproxy is enabled and started"
  ansible.builtin.service:
    name: tinyproxy
    state: started
    enabled: true
